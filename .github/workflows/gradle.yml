name: Java CI with Gradle

on:
  push:
    branches-ignore:
      - 'l10n*'
    tags:
      - '*'
jobs:
  maven:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Fetch Tags
        run: git fetch --unshallow --tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Publish to Maven
        run: ./gradlew publish

  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_ID: ${{ vars.MODRINTH_ID }}
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Fetch Tags
        run: git fetch --unshallow --tags
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Publish to Maven
        run: ./gradlew publish
      - name: Get tag
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        id: tag
        uses: dawidd6/action-get-tag@v1
      - uses: jungwinter/split@v2
        id: split
        with:
          separator: "+"
          msg: ${{steps.tag.outputs.tag}}
      - name: "Rename Fabric files"
        run: mv "fabric/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}.jar" "fabric/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}-fabric.jar"
      - name: "Rename NeoForge files"
        run: mv "neoforge/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}.jar" "neoforge/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}-neoforge.jar"
      - name: "Upload Fabric"
        uses: Kira-NT/mc-publish@v3
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[Fabric ${{steps.split.outputs._1}}] Immersive Machinery - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}-fabric.jar"
          loaders: |
            fabric
          environment: client | server
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 21
          dependencies: |
            fabric-api | required | *

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kira-NT/mc-publish@v3
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[NeoForge ${{steps.split.outputs._1}}] Immersive Machinery - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "neoforge/build/libs/immersive_machinery-${{steps.tag.outputs.tag}}-neoforge.jar"
          loaders: |
            neoforge
          environment: client | server
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 21

          fail-mode: skip
