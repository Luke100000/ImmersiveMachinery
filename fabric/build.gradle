plugins {
    id "net.fabricmc.fabric-loom"
}

apply from: rootProject.file("gradle/shared-sources.gradle")

loom {
    runs {
        client {
            runDir("run/client")
        }
        server {
            runDir("run/server")
            programArg("--nogui")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation("net.conczin:immersive_aircraft:${immersive_aircraft_version}+fabric") { transitive = false }
}

processResources {
    def properties = [version: project.version, minecraft_version: minecraft_version,
                      fabric_loader_version: fabric_loader_version, java_version: java_version]
    inputs.properties properties
    filesMatching("fabric.mod.json") {
        expand properties
    }
}
