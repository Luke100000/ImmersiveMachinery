plugins {
    id "net.neoforged.moddev"
}

neoForge {
    neoFormVersion = rootProject.neo_form_version
}

dependencies {
    compileOnly("net.conczin:immersive_aircraft:${immersive_aircraft_version}+fabric") { transitive = false }
    compileOnly "org.spongepowered:mixin:0.8.7"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
