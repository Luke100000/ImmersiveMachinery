plugins {
    id "net.fabricmc.fabric-loom" version "${fabric_loom_version}" apply false
    id "net.neoforged.moddev" version "${neoforge_moddev_version}" apply false
}

def getAppVersion = { ->
    try {
        def process = new ProcessBuilder("git", "tag", "--points-at", "HEAD")
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def tags = process.inputStream.getText("UTF-8").readLines()
        process.waitFor()
        return tags.find { it.endsWith("+${rootProject.minecraft_version}") } ?: "${rootProject.minecraft_version}-SNAPSHOT"
    } catch (Exception e) {
        logger.warn("Could not read Git tags: ${e.message}")
        return "${rootProject.minecraft_version}-DEV"
    }
}

allprojects {
    group = rootProject.group_id
    version = getAppVersion()
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "maven-publish"

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven {
            url "https://maven.conczin.net/Artifacts"
            content { includeGroup "net.conczin" }
        }
    }

    base {
        archivesName = rootProject.archives_base_name
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.java_version)
    }

    def exclusionPatterns = ["**/*.aup3", "**/.xdp-*", "**/*.kra", "**/*~*"]
    tasks.withType(ProcessResources).configureEach {
        exclude exclusionPatterns
    }
    tasks.named("sourcesJar").configure {
        exclude exclusionPatterns
    }
    tasks.named("jar").configure {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${project.name}" }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = rootProject.archives_base_name
                version = "${project.version}+${project.name}"
                from components.java
            }
        }
        repositories {
            maven {
                name = "reposiliteRepository"
                url = uri("https://maven.conczin.net/Artifacts")
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_TOKEN")
                }
            }
        }
    }
}
