plugins {
    id "net.neoforged.moddev"
}

apply from: rootProject.file("gradle/shared-sources.gradle")

neoForge {
    version = rootProject.neoforge_version
    runs {
        client {
            client()
            gameDirectory = file("run/client")
        }
        server {
            server()
            gameDirectory = file("run/server")
            programArgument "--nogui"
        }
    }
    mods {
        "immersive_machinery" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("net.conczin:immersive_aircraft:${immersive_aircraft_version}+neoforge") { transitive = false }
}

processResources {
    def properties = [version: project.version, minecraft_version_range: minecraft_version_range,
                      neoforge_version: neoforge_version]
    inputs.properties properties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}
